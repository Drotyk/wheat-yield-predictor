name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make nlohmann-json3-dev catch2 cppcheck

      - name: Code Quality & Static Analysis (Lint)
        run: |
          cppcheck --enable=warning,style,performance,portability --error-exitcode=1 -I cls src/ main.cpp tests/ || true

      - name: Build project
        run: make

      - name: Run unit tests
        run: make test
